services:
  # ---------- Infrastructure ----------
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "Your_password123"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Your_password123 -No -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------- Services ----------
  identity:
    build:
      context: .
      dockerfile: services/Identity/Identity.API/Dockerfile
    environment:
      ConnectionStrings__IdentityDb: "Server=sqlserver,1433;Database=IdentityDb;User Id=sa;Password=Your_password123;TrustServerCertificate=True;"
    ports:
      - "8001:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

  catalog:
    build:
      context: .
      dockerfile: services/Catalog/Catalog.API/Dockerfile
    environment:
      ConnectionStrings__CatalogDb: "Server=sqlserver,1433;Database=CatalogDb;User Id=sa;Password=Your_password123;TrustServerCertificate=True;"
    ports:
      - "8002:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

  cart:
    build:
      context: .
      dockerfile: services/Cart/Cart.API/Dockerfile
    environment:
      ConnectionStrings__Redis: "redis:6379"
    ports:
      - "8003:8080"
    depends_on:
      - redis

  inventory:
    build:
      context: .
      dockerfile: services/Inventory/Inventory.API/Dockerfile
    environment:
      ConnectionStrings__InventoryDb: "Server=sqlserver,1433;Database=InventoryDb;User Id=sa;Password=Your_password123;TrustServerCertificate=True;"
      RabbitMq__Host: "rabbitmq"
    ports:
      - "8004:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  order:
    build:
      context: .
      dockerfile: services/Order/Order.API/Dockerfile
    environment:
      ConnectionStrings__OrderDb: "Server=sqlserver,1433;Database=OrderDb;User Id=sa;Password=Your_password123;TrustServerCertificate=True;"
      RabbitMq__Host: "rabbitmq"
    ports:
      - "8005:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  payment:
    build:
      context: .
      dockerfile: services/Payment/Payment.API/Dockerfile
    environment:
      ConnectionStrings__PaymentDb: "Server=sqlserver,1433;Database=PaymentDb;User Id=sa;Password=Your_password123;TrustServerCertificate=True;"
      RabbitMq__Host: "rabbitmq"
    ports:
      - "8006:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  notification:
    build:
      context: .
      dockerfile: services/Notification/Notification.API/Dockerfile
    environment:
      RabbitMq__Host: "rabbitmq"
    ports:
      - "8007:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: gateway/ApiGateway/Dockerfile
    ports:
      - "8000:8080"
    depends_on:
      - identity
      - catalog
      - cart
      - inventory
      - order
      - payment
