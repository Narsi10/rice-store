server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: route all unknown paths to index.html so Angular routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't cache config.json so the gateway URL can change without rebuilds.
    location = /assets/config.json {
        add_header Cache-Control "no-store";
    }
}
