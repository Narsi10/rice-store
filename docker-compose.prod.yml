# Production compose: builds ALL services + the Angular frontend, and pulls
# secrets from environment variables (see .env.example). Run with:
#   docker compose -f docker-compose.prod.yml --env-file .env up --build -d
#
# On the server, the frontend is served on port 80 and talks to the gateway
# through the public URL you set in FRONTEND_GATEWAY_URL.

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $${DB_PASSWORD} -No -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine

  rabbitmq:
    image: rabbitmq:3-management
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  identity:
    build: { context: ., dockerfile: services/Identity/Identity.API/Dockerfile }
    environment:
      ConnectionStrings__IdentityDb: "Server=sqlserver,1433;Database=IdentityDb;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;"
      Jwt__Key: "${JWT_KEY}"
      Admin__Email: "${ADMIN_EMAIL}"
      Admin__Password: "${ADMIN_PASSWORD}"
      Admin__FullName: "${ADMIN_FULLNAME}"
    depends_on:
      sqlserver: { condition: service_healthy }

  catalog:
    build: { context: ., dockerfile: services/Catalog/Catalog.API/Dockerfile }
    environment:
      ConnectionStrings__CatalogDb: "Server=sqlserver,1433;Database=CatalogDb;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;"
    depends_on:
      sqlserver: { condition: service_healthy }

  cart:
    build: { context: ., dockerfile: services/Cart/Cart.API/Dockerfile }
    environment:
      ConnectionStrings__Redis: "redis:6379"
    depends_on: [redis]

  inventory:
    build: { context: ., dockerfile: services/Inventory/Inventory.API/Dockerfile }
    environment:
      ConnectionStrings__InventoryDb: "Server=sqlserver,1433;Database=InventoryDb;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;"
      RabbitMq__Host: "rabbitmq"
    depends_on:
      sqlserver: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  order:
    build: { context: ., dockerfile: services/Order/Order.API/Dockerfile }
    environment:
      ConnectionStrings__OrderDb: "Server=sqlserver,1433;Database=OrderDb;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;"
      RabbitMq__Host: "rabbitmq"
    depends_on:
      sqlserver: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  payment:
    build: { context: ., dockerfile: services/Payment/Payment.API/Dockerfile }
    environment:
      ConnectionStrings__PaymentDb: "Server=sqlserver,1433;Database=PaymentDb;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;"
      RabbitMq__Host: "rabbitmq"
    depends_on:
      sqlserver: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  notification:
    build: { context: ., dockerfile: services/Notification/Notification.API/Dockerfile }
    environment:
      RabbitMq__Host: "rabbitmq"
      Email__SmtpHost: "smtp-relay.brevo.com"
      Email__SmtpPort: "587"
      Email__SmtpLogin: "${EMAIL_SMTP_LOGIN}"
      Email__SmtpKey: "${EMAIL_SMTP_KEY}"
      Email__FromEmail: "${EMAIL_FROM}"
      Email__FromName: "Rice Store"
    depends_on:
      rabbitmq: { condition: service_healthy }

  gateway:
    build: { context: ., dockerfile: gateway/ApiGateway/Dockerfile }
    # No published port — Caddy proxies to it internally on 8080.
    expose:
      - "8080"
    depends_on: [identity, catalog, cart, inventory, order, payment]

  frontend:
    build: { context: ./frontend/rice-store-web, dockerfile: Dockerfile }
    environment:
      FRONTEND_GATEWAY_URL: "${FRONTEND_GATEWAY_URL}"
    expose:
      - "80"
    depends_on: [gateway]

  # HTTPS reverse proxy with automatic Let's Encrypt certificates.
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: "${SITE_DOMAIN}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [frontend, gateway]

volumes:
  sqldata:
  caddy_data:
  caddy_config:
